<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Selected photography by Yuxin Jin — street scenes, landscapes, architecture, and everyday moments." />
  <meta name="author" content="Yuxin Jin" />
  <meta property="og:title" content="Photography | Yuxin Jin" />
  <meta property="og:description" content="Selected photography by Yuxin Jin." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/photography/thumb-05.webp" />
  <title>Photography | Yuxin Jin</title>
  <link rel="stylesheet" href="photography.css" />
</head>
<body>
  <main class="portfolio">
    <header class="portfolio-header">
      <div class="topline">
        <a href="index.html">← Back to academic homepage</a>
        <span>Yuxin Jin</span>
      </div>

      <div class="intro-copy">
        <p class="eyebrow">Selected works</p>
        <h1>Photography</h1>
        <p class="lead">
          I photograph street fragments, landscapes, architecture, and small everyday details.
          This is a small collection of places, light, and moments that I wanted to keep.
        </p>
      </div>
    </header>

    <section class="photo-sequence" aria-label="Photography gallery">
      <div class="gallery-row one">
        <a href="photos/photo-05.jpg" data-lightbox data-alt="Wildflowers beside a mountain lake">
          <img src="assets/photography/thumb-05.webp" alt="Wildflowers beside a mountain lake" loading="eager" />
        </a>
      </div>

      <div class="gallery-row two">
        <a href="photos/photo-03.jpg" data-lightbox data-alt="Horses in a mountain valley">
          <img src="assets/photography/thumb-03.webp" alt="Horses in a mountain valley" loading="lazy" />
        </a>
        <a href="photos/photo-04.jpg" data-lightbox data-alt="Sheep and yurts on a green hillside">
          <img src="assets/photography/thumb-04.webp" alt="Sheep and yurts on a green hillside" loading="lazy" />
        </a>
      </div>

      <div class="gallery-row two">
        <a href="photos/photo-01.jpg" data-lightbox data-alt="Snack stand at sunset">
          <img src="assets/photography/thumb-01.webp" alt="Snack stand at sunset" loading="lazy" />
        </a>
        <a href="photos/photo-02.jpg" data-lightbox data-alt="Park carts in evening light">
          <img src="assets/photography/thumb-02.webp" alt="Park carts in evening light" loading="lazy" />
        </a>
      </div>

      <div class="gallery-row three">
        <a href="photos/photo-07.jpg" data-lightbox data-alt="Cable-stayed bridge in daylight">
          <img src="assets/photography/thumb-07.webp" alt="Cable-stayed bridge in daylight" loading="lazy" />
        </a>
        <a href="photos/photo-08.jpg" data-lightbox data-alt="Cable-stayed bridge at sunset">
          <img src="assets/photography/thumb-08.webp" alt="Cable-stayed bridge at sunset" loading="lazy" />
        </a>
        <a href="photos/photo-09.jpg" data-lightbox data-alt="Old locomotive in snow">
          <img src="assets/photography/thumb-09.webp" alt="Old locomotive in snow" loading="lazy" />
        </a>
      </div>

      <div class="gallery-row two">
        <a href="photos/photo-13.jpg" data-lightbox data-alt="Historic waterfront architecture and modern skyline">
          <img src="assets/photography/thumb-13.webp" alt="Historic waterfront architecture and modern skyline" loading="lazy" />
        </a>
        <a href="photos/photo-17.jpg" data-lightbox data-alt="Traditional tower aligned with the full moon">
          <img src="assets/photography/thumb-17.webp" alt="Traditional tower aligned with the full moon" loading="lazy" />
        </a>
      </div>

      <div class="gallery-row three">
        <a href="photos/photo-06.jpg" data-lightbox data-alt="Colorful candy at a market">
          <img src="assets/photography/thumb-06.webp" alt="Colorful candy at a market" loading="lazy" />
        </a>
        <a href="photos/photo-14.jpg" data-lightbox data-alt="Night flower vendor with bicycle">
          <img src="assets/photography/thumb-14.webp" alt="Night flower vendor with bicycle" loading="lazy" />
        </a>
        <a href="photos/photo-16.jpg" data-lightbox data-alt="Vegetable market and handwritten price signs">
          <img src="assets/photography/thumb-16.webp" alt="Vegetable market and handwritten price signs" loading="lazy" />
        </a>
      </div>

      <div class="gallery-row two-narrow">
        <a href="photos/photo-10.jpg" data-lightbox data-alt="Backlit bottles in a bar">
          <img src="assets/photography/thumb-10.webp" alt="Backlit bottles in a bar" loading="lazy" />
        </a>
        <a href="photos/photo-15.jpg" data-lightbox data-alt="Everyday goods at a street market">
          <img src="assets/photography/thumb-15.webp" alt="Everyday goods at a street market" loading="lazy" />
        </a>
      </div>

      <div class="gallery-row asym">
        <a href="photos/photo-11.jpg" data-lightbox data-alt="Traditional Chinese architecture behind leaves">
          <img src="assets/photography/thumb-11.webp" alt="Traditional Chinese architecture behind leaves" loading="lazy" />
        </a>
        <a href="photos/photo-12.jpg" data-lightbox data-alt="Small orange flowers and green leaves">
          <img src="assets/photography/thumb-12.webp" alt="Small orange flowers and green leaves" loading="lazy" />
        </a>
      </div>
    </section>

    <footer>
      <p>© 2026 Yuxin Jin</p>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer">
    <button class="lightbox-close" type="button" aria-label="Close image viewer">×</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photograph">‹</button>
    <figure class="lightbox-figure">
      <img id="lightbox-image" src="" alt="" />
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photograph">›</button>
  </div>
  <script src="photography.js"></script>
</body>
</html>
